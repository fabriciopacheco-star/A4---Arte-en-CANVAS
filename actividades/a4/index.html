<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4 Arte en Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }

    p.description {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 700px;
      width: 100%;
    }

    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      align-self: flex-start;
      color: var(--text-main);
      border-left: 4px solid var(--accent);
      padding-left: 0.5rem;
    }

    canvas {
      background-color: #020617;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      max-width: 100%;
      height: auto;
    }

    footer {
      margin-top: 3rem;
    }

    .btn-home {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      background-color: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      background-color: var(--accent);
      color: var(--bg-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>A4 Arte en Canvas</h1>
    <p class="description">Demostración de arte geométrico 2D y animación mediante elementos Canvas.</p>
  </header>

  <main class="main-grid">

    <!-- Ejercicio 1 -->
    <section class="section-card">
      <h2>01. Composición Estática con Rectángulos</h2>
      <canvas id="canvasArte" width="600" height="350"></canvas>
    </section>

    <!-- Ejercicio 2 -->
    <section class="section-card">
      <h2>02. Animación Interactiva</h2>
      <canvas id="canvasAnimacion" width="600" height="350"></canvas>
    </section>

  </main>

  <footer>
    <a href="../../index.html" class="btn-home">← Volver al Menú Principal</a>
  </footer>

  <script>
    // --- 1. DIBUJO DE ARTE ESTÁTICO ---
    const canvas1 = document.getElementById('canvasArte');
    const ctx1 = canvas1.getContext('2d');

    // Fondo
    ctx1.fillStyle = '#090d16';
    ctx1.fillRect(0, 0, canvas1.width, canvas1.height);

    // Formas compuestas por rectángulos
    ctx1.fillStyle = '#0284c7';
    ctx1.fillRect(50, 40, 220, 270);

    ctx1.fillStyle = 'rgba(239, 68, 68, 0.8)';
    ctx1.fillRect(200, 80, 280, 140);

    ctx1.fillStyle = 'rgba(245, 158, 11, 0.9)';
    ctx1.fillRect(140, 180, 320, 100);

    ctx1.fillStyle = '#10b981';
    ctx1.fillRect(410, 50, 130, 130);

    // Acentos
    ctx1.fillStyle = '#f8fafc';
    ctx1.fillRect(80, 70, 40, 40);
    ctx1.fillRect(440, 220, 30, 30);

    // Bordes estructurales
    ctx1.strokeStyle = '#38bdf8';
    ctx1.lineWidth = 3;
    ctx1.strokeRect(30, 20, 540, 310);


    // --- 2. ANIMACIÓN BÁSICA ---
    const canvas2 = document.getElementById('canvasAnimacion');
    const ctx2 = canvas2.getContext('2d');

    let posX = 40;
    let posY = 150;
    let tamano = 50;
    let velX = 5;

    function ejecutarAnimacion() {
      // Limpiar lienzo
      ctx2.fillStyle = '#090d16';
      ctx2.fillRect(0, 0, canvas2.width, canvas2.height);

      // Dibujar elemento
      ctx2.fillStyle = '#38bdf8';
      ctx2.fillRect(posX, posY, tamano, tamano);

      ctx2.strokeStyle = '#f8fafc';
      ctx2.lineWidth = 2;
      ctx2.strokeRect(posX, posY, tamano, tamano);

      // Mover elemento
      posX += velX;

      // Rebote de bordes
      if (posX + tamano > canvas2.width || posX < 0) {
        velX *= -1;
      }

      requestAnimationFrame(ejecutarAnimacion);
    }

    ejecutarAnimacion();
  </script>

</body>
</html>
