<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Principal — Fabricio Pacheco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #131924;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 9999px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .user-info {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.4rem 0;
    }

    .info-row span:first-child {
      color: var(--muted);
    }

    .info-row span:last-child {
      color: #ffffff;
      font-weight: 600;
    }

    .menu-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1rem 1.25rem;
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .btn-link:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: #1f2937;
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #374151;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Menú Principal</span>
    <h1>Fabricio Pacheco Rendón</h1>
    <p class="subtitle">Portafolio de actividades y proyectos de animación web.</p>

    <div class="user-info">
      <div class="info-row">
        <span>Alumno:</span>
        <span>Fabricio Pacheco Rendón</span>
      </div>
      <div class="info-row">
        <span>Discord:</span>
        <span>@fabriciopacheco</span>
      </div>
    </div>

    <div class="menu-links">
      <a href="actividades/a4/index.html" class="btn-link">
        <span>Ver Actividad 04 (Galería + Canvas)</span>
        <span>→</span>
      </a>
      <a href="actividades/a4/index.html#canvas-section" class="btn-link btn-secondary">
        <span>Ir directo a Arte en Canvas</span>
        <span>🎨</span>
      </a>
    </div>
  </div>

</body>
</html>
